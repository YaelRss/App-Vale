<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra y Halo Suave -->
    <filter id="calc-halo" x="-20%" y="-20%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#e8385d" flood-opacity="0.32"/>
    </filter>
    
    <filter id="btn-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#990f30" flood-opacity="0.22"/>
    </filter>

    <filter id="badge-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="4.5" flood-color="#800a25" flood-opacity="0.26"/>
    </filter>
  </defs>

  <!-- CUERPO DE LA CALCULADORA -->
  <g filter="url(#calc-halo)">
    <!-- Borde Exterior Rosa Suave -->
    <rect x="74" y="64" width="364" height="392" rx="68" fill="#ff7c97" />
    
    <!-- Chasis Principal Rosa Sandía -->
    <rect x="86" y="76" width="340" height="368" rx="56" fill="#ee3f65" />
  </g>

  <!-- PANTALLA / CARITA KAWAII -->
  <g id="screen">
    <!-- Fondo Pantalla -->
    <rect x="108" y="98" width="296" height="116" rx="34" fill="#fff0f3" />
    
    <!-- Corazón Superior Derecho -->
    <path d="M 373 123 C 373 118.5 369 115 364.5 115 C 360.5 115 358 118 358 118 C 358 118 355.5 115 351.5 115 C 347 115 343 118.5 343 123 C 343 130 352 135.5 358 140 C 364 135.5 373 130 373 123 Z" fill="#eb345c"/>

    <!-- Sonrojo Izquierdo -->
    <ellipse cx="148" cy="164" rx="14.5" ry="8" fill="#ffaec0" />

    <!-- Ojo Izquierdo con Brillos -->
    <circle cx="178" cy="151" r="14.5" fill="#1b2028" />
    <circle cx="173.5" cy="146" r="5.2" fill="#ffffff" />
    <circle cx="182.5" cy="155.5" r="2.2" fill="#ffffff" />

    <!-- Sonrisa -->
    <path d="M 233 154 Q 246 167 259 154" fill="none" stroke="#1b2028" stroke-width="4.5" stroke-linecap="round" />

    <!-- Ojo Derecho con Brillos -->
    <circle cx="314" cy="151" r="14.5" fill="#1b2028" />
    <circle cx="309.5" cy="146" r="5.2" fill="#ffffff" />
    <circle cx="318.5" cy="155.5" r="2.2" fill="#ffffff" />

    <!-- Sonrojo Derecho -->
    <ellipse cx="344" cy="164" rx="14.5" ry="8" fill="#ffaec0" />
  </g>

  <!-- BOTONERA -->
  <g id="keypad">
    <!-- FILA 1 -->
    <!-- Botón AC (Blanco con texto rojo) -->
    <g filter="url(#btn-shadow)">
      <rect x="114" y="234" width="62" height="52" rx="18" fill="#ffffff" />
      <path d="M 131 270 L 138 248 L 145 270 M 133 264 H 143" fill="none" stroke="#ee3f65" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 160 252.5 C 153 249 148 253 148 259 C 148 265 153 269 160 265.5" fill="none" stroke="#ee3f65" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Botón +/- -->
    <g filter="url(#btn-shadow)">
      <rect x="187" y="234" width="62" height="52" rx="18" fill="#f55b7d" />
      <path d="M 210 255 H 226 M 218 247 V 263 M 210 271 H 226" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Botón % -->
    <g filter="url(#btn-shadow)">
      <rect x="260" y="234" width="62" height="52" rx="18" fill="#f55b7d" />
      <circle cx="279" cy="253" r="3.2" fill="none" stroke="#ffffff" stroke-width="2.6"/>
      <line x1="281" y1="269" x2="301" y2="249" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <circle cx="303" cy="265" r="3.2" fill="none" stroke="#ffffff" stroke-width="2.6"/>
    </g>

    <!-- Botón ÷ (Rosa Pastel Sobresaliente) -->
    <g filter="url(#badge-shadow)">
      <rect x="333" y="234" width="70" height="52" rx="20" fill="#ffa0b5" />
      <circle cx="368" cy="249" r="2.8" fill="#ffffff"/>
      <line x1="357" y1="260" x2="379" y2="260" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="368" cy="271" r="2.8" fill="#ffffff"/>
    </g>

    <!-- FILA 2 -->
    <!-- Botón 7 -->
    <g filter="url(#btn-shadow)">
      <rect x="114" y="299" width="62" height="52" rx="18" fill="#f55b7d" />
      <path d="M 137 314 H 153.5 L 142 338" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Botón 8 -->
    <g filter="url(#btn-shadow)">
      <rect x="187" y="299" width="62" height="52" rx="18" fill="#f55b7d" />
      <circle cx="218" cy="318" r="5.5" fill="none" stroke="#ffffff" stroke-width="3.5"/>
      <circle cx="218" cy="332" r="6.8" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    </g>

    <!-- Botón 9 -->
    <g filter="url(#btn-shadow)">
      <rect x="260" y="299" width="62" height="52" rx="18" fill="#f55b7d" />
      <path d="M 297 322 C 297 315 285 315 285 322 C 285 329 297 329 297 322 Z M 297 322 V 338" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Botón × (Rosa Pastel Sobresaliente) -->
    <g filter="url(#badge-shadow)">
      <rect x="333" y="299" width="70" height="52" rx="20" fill="#ffa0b5" />
      <line x1="359" y1="316" x2="377" y2="334" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
      <line x1="377" y1="316" x2="359" y2="334" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- FILA 3 -->
    <!-- Botón 0 (Ancho) -->
    <g filter="url(#btn-shadow)">
      <rect x="114" y="364" width="135" height="52" rx="18" fill="#f55b7d" />
      <ellipse cx="181.5" cy="390" rx="6.5" ry="11" fill="none" stroke="#ffffff" stroke-width="4"/>
    </g>

    <!-- Botón . (Punto) -->
    <g filter="url(#btn-shadow)">
      <rect x="260" y="364" width="62" height="52" rx="18" fill="#f55b7d" />
      <circle cx="291" cy="395" r="4" fill="#ffffff" />
    </g>

    <!-- Botón = (Blanco Sobresaliente con Signo Rojo) -->
    <g filter="url(#badge-shadow)">
      <rect x="333" y="364" width="70" height="52" rx="20" fill="#ffffff" />
      <line x1="357" y1="384" x2="379" y2="384" stroke="#ee3f65" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="357" y1="396" x2="379" y2="396" stroke="#ee3f65" stroke-width="4.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>